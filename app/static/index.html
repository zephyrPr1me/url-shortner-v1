<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/static/style.css" />
    <title>URL Shortener</title>
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <header>
        <div class="logo">
          <div class="logo-icon">🔗</div>
          <span class="logo-text">ShortLink</span>
        </div>
        <button
          class="theme-toggle"
          id="themeToggle"
          title="Toggle theme"
          aria-label="Toggle theme"
        >
          🌙
        </button>
      </header>

      <main>
        <!-- Shorten Form -->
        <section class="card">
          <h2 class="card-title">Shorten URL</h2>
          <form class="url-form" id="shortenForm">
            <div class="input-group">
              <input
                type="url"
                id="urlInput"
                placeholder="https://example.com/very-long-url"
                required
                autofocus
              />
              <button type="submit" class="btn btn-primary" id="submitBtn">
                <span id="btnText">Shorten</span>
                <span id="btnSpinner" class="spinner" style="display: none"></span>
              </button>
            </div>
          </form>
        </section>

        <!-- Result (hidden by default) -->
        <section class="card result-card" id="resultCard" style="display: none">
          <h2 class="card-title">Done!</h2>
          <div class="result-box">
            <a href="#" id="resultLink" target="_blank" rel="noopener"></a>
            <button class="btn-copy" id="copyBtn" data-copied="false">Copy</button>
          </div>
        </section>

        <!-- History -->
        <section class="card" id="historyCard">
          <h2 class="card-title">Your Links</h2>
          <div class="history-list" id="historyList">
            <div class="history-empty">No shortened links yet</div>
          </div>
        </section>
      </main>

      <!-- Toast Notification -->
      <div class="toast" id="toast" role="alert" aria-live="polite"></div>

      <footer>FastAPI URL Shortener &middot; v1.0</footer>
    </div>

    <script src="/static/script.js"></script>
  </body>
</html>
