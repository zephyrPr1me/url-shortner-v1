[project]
name = "fastapi-url-shortner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.28.0",
    "fastapi[standard]>=0.135.3",
    "pydantic-settings>=2.14.0",
    "requests>=2.33.1",
    "ruff>=0.15.10",
    "sqlalchemy[asyncio]>=2.0.49",
    "psycopg[binary]>=3.1.0",
    "uvicorn>=0.44.0",
    "slowapi>=0.1.10",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = [
    "."
]
